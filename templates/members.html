<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="vieport" content="width=device-width,initial-scale=1.0">
        <title>Tech Community</title>
        <link rel="stylesheet" href="static/style.css">
        <style>
            body {
                color: #000;
                background: #fff;
            }
            h1 {
                font-weight: bold;
                font-size: 2rem;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            table {
                width: 70%;
                height: auto;
                margin: 0 auto;
                color: #fff;
                background: #4f46e5;
                border: 2px solid #4f46e5;
                border-radius: 10px;
                font-weight: bold;
            }
            @media (min-width: 768px) {
                .table {
                    font-size: 0.8rem;
                    width: 100%;
                }
            }
            @media (min-width: 414px) {
                .table {
                    font-size: 0.8rem;
                    width: 100%;
                }
            }
            @media (min-width: 374px) {
                .table {
                    font-size: 0.8rem;
                    width: 100%;
                }
            }
            @media (min-width: 360px) {
                .table {
                    font-size: 0.8rem;
                    width: 100%;
                }
            }
            @media (min-width: 344px) {
                .table {
                    font-size: 0.8rem;
                    width: 100%;
                }
            }
            @media (min-width: 1024px) {
                .table {
                    font-size: 1.5rem;
                    width: 100%;
                }
            }
            @media (min-width: 1440px) {
                .table {
                    font-size: 2rem;
                    width: 100%;
                }
            }
            .table tr {
                border: 1px solid #4f46e5;
            }
            .table td {
                border: 1px solid #4f46e5;
            }
            .table th {
                border: 1px solid #4f46e5;
                color: #000;
            }
        </style>
    </head>
    <body>
        {% extends "base.html" %}

        {% block title %}Members{% endblock %}

        {% block content %}
        <div class="container">
            <h1>Community Members</h1>
            <table class="table" border="2">
            <tr><th>Name</th><th>Gender</th><th>Date of Birth</th><th>Joined</th></tr>
            {% for member in members %}
                <tr>
                    <td>{{ member.full_name }}</td>
                    <td>{{ member.gender }}</td>
                    <td>{{ member.dob }}</td>
                    <td>{{ member.created_at }}</td>
                </tr>
            {% endfor %}
            </table>
        </div>
        {% endblock %}
    </body>
</html>
