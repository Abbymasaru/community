<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="Author" content="Abubakari.mohamed.msaru"/>
    <title>Tech Community | Log In</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-weight: bold;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        .log-form {
            width: 100%;
            height: auto;
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            transition: transform 0.3s ease;
        }
        .log-form:hover {
            transform: translateY(-5px);
        }
        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .form-header h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #1a1a1a;
        }
        .flash-message {
            padding: 12px 16px;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            display: none;
            text-align: center;
        }
        .flash-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .flash-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: #444;
        }
        .input-group {
            position: relative;
            margin-bottom: 1.2rem;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 40px 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.15);
        }
        .eye-icon {
            position: absolute;
            top: 70%;
            right: 10px;
            transform: translateY(-50%);
            cursor: pointer;
            color: #777;
            font-size: 1.2rem;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn button {
            width: 100%;
            color: #fff;
            background: #4f46e5;
            border: none;
            border-radius: 10px;
            height: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            margin: 1rem 0;
        }
        .btn button:hover {
            background: #fff;
            color: #4f46e5;
            border: 2px solid #4f46e5;
            transform: translateY(-2px);
        }
        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: #555;
        }
        .signup-link a {
            color: #0066ff;
            font-weight: 600;
            text-decoration: none;
        }
        .signup-link a:hover {
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .log-form {
                padding: 2rem 1.5rem;
            }

            .form-header h2 {
                font-size: 1.8rem;
            }
        }
        @media (min-width: 640px) {
            .log-form {
                height: 500px;
                max-width: 400px;
                font-size: 0.2px;
            }
            .input-group label {
                font-size: 1rem;
            }
            .input-group input[type='text'], 
            .input-group input[type='email'],
            .input-group input[type='password'] {
                height: 33px;
                font-size: 1rem;
            }
            .form-header h2 {
                font-size: 1.5rem;
            }
            .submit button {
                width: 100px;
                height: 30px;
                font-size: 0.7rem;
            }
            .alternative-options {
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <section class="log-form">
        <div class="form-header">
            <h2>Log In</h2>
        </div>

        <!-- Flash message area -->
        <div id="flash-message" class="flash-message"></div>

        <form action="/log" method="POST" enctype="multipart/form-data" onsubmit="return validatePasswords()">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="your.email@example.com" required autofocus/>
            </div><br>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Your password" required/>
                <span class="eye-icon" onclick="togglePassword('password')">👁️</span>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required/>
                <span class="eye-icon" onclick="togglePassword('confirmPassword')">👁️</span>
            </div>

            <div class="btn">
                <button type="submit" class="btn">Log In</button>
            </div>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="/sign">Sign up</a>
        </div>
    </section>
</div>

<script>
    // Flash message function (same as signup)
    function showFlash(message, category = 'info') {
        const flash = document.getElementById('flash-message');
        flash.textContent = message;
        flash.className = 'flash-message'; // reset

        if (category === 'success') {
            flash.classList.add('flash-success');
        } else if (category === 'error' || category === 'danger') {
            flash.classList.add('flash-error');
        }

        flash.style.display = 'block';
        setTimeout(() => {
            flash.style.opacity = '0';
            setTimeout(() => { flash.style.display = 'none'; flash.style.opacity = '1'; }, 400);
        }, 5000);
    }

    // Demo success message (remove later — trigger from Flask)
    // showFlash("Logged in successfully! Welcome back 🚀", "success");

    // Password validation before submit
    function validatePasswords() {
        const pass = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        if (pass !== confirm) {
            showFlash("Passwords do not match!", "error");
            return false;
        }
        return true;
    }

    // Show/hide password toggle
    function togglePassword(id) {
        const input = document.getElementById(id);
        const type = input.type === 'password' ? 'text' : 'password';
        input.type = type;
        input.style.width = '100%';
        input.style.height = '33px';
        input.style.borderRadius = '10px';
        input.style.padding = '10px';
        input.style.border = '1px solid #ddd';
    }
</script>
</body>
</html>
