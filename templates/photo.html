<body>
{% extends "base.html" %}
{% block title %}News - Tech Community{% endblock %}
{% block content %}
<h1>Community Updates & Tech News</h1>

<div class="add-news">

<div class="show-form">
<button id="addPostBtn">
<img src="https://img.icons8.com/?size=50&id=38113&format=png" width="25">
Add Post
</button>
</div>

<form method="POST" class="news-form">
<div class="form-header">
<h3>Add New Post</h3>
</div>

<input type="text" name="heading" placeholder="Heading" required><br><br>

<input type="url" name="image_url" placeholder="Image URL (optional)"><br><br>

<textarea name="description" placeholder="Description" rows="5" required></textarea><br><br>

<div class="post-button">
<button type="submit">Post</button>
</div>

</form>

</div>

<div class="news-list">
{% for post in news_list %}
<div class="news-card">
    <h3>{{ post.heading }}</h3>
    {% if post.image_url %}<img src="{{ post.image_url }}">{% endif %}
    <div class="post-desc">
        <p>{{ post.description }}</p>
    </div>
    <small>By {{ post.author }} | {{ post.created_at }}</small>

    <div class="votes" data-news-id="{{ post.id }}">
    <a href="{{ url_for('like', news_id=post.id, action='like') }}" 
       class="vote-btn" 
       data-action="like">
        <img src="https://images.icon-icons.com/2806/PNG/96/like_thumbs_up_icon_178899.png" 
             width="25" alt="Like">
        <span class="like-count">{{ post.likes }}</span>
    </a>

    <a href="{{ url_for('like', news_id=post.id, action='dislike') }}" 
       class="vote-btn" 
       data-action="dislike">
        <img src="https://images.icon-icons.com/2806/PNG/96/dislike_emo_emoji_emoticon_icon_178902.png" 
             width="25" alt="Dislike">
        <span class="dislike-count">{{ post.dislikes }}</span>
    </a>
</div>


    <button class="comment-btn" onclick="toggleComments('{{ post.id }}')">
        💬 {{ comments_dict[post.id]|length }} 
    </button>


    <div id="comments-section-{{ post.id }}" class="comments-section">
        <div class="comment-list">
            {% for comment in comments_dict.get(post.id, []) %}
            <div class="comment">
                <strong>{{ comment.author }}</strong> 
                <small>{{ comment.created_at }}</small>
                <p>{{ comment.comment_text }}</p>
            </div>
            {% endfor %}
        </div>

        <div class="comment-form">
            <textarea id="comment-text-{{ post.id }}" placeholder="Write a comment..." rows="3"></textarea>
            <button onclick="submitComment('{{ post.id }}')">Post Comment</button>
        </div>
    </div>
</div>
{% endfor %}
</div>
<script src="static/script.js"></script>
{% endblock %}
</body>
</html>-->

{% extends "base.html" %}

        <div class="caption">
            <p>{{ reel.caption }}</p>
        </div>
        <small>By {{ reel.author }} | {{ reel.created_at }}</small>
    </div>
    {% endfor %}
</div>

// Simple JS to show/hide reel form (same pattern as news.html)

    const form = document.querySelector('.reel-form');

});
</script>
