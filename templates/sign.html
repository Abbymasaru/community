<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Abubakari.mohamed.msaru">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <title>Tech Community - Sign Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ccc;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-size: 1rem;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 1440px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .sign-form {
            background: #fff;
            color: #000;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 4px 6px  rgba(0,0,0,0.2);
            width: 100%;
            height: auto;
            transition: all 0.3s ease;
        }
        @media (min-width: 768px) {
            body, .sign-form {
                font-size: 0.4rem;
                width: 100%;
            }
        }
        @media (min-width: 414px) {
            body, .sign-form {
                font-size: 0.6rem;
                width: 100%;
            }
        }
        @media (min-width: 374px) {
            body, .sign-form {
                font-size: 0.6rem;
                width: 100%;
            }
        }
        @media (min-width: 360px) {
            body, .sign-form {
                font-size: 0.7rem;
                width: 100%;
            }
        }
        @media (min-width: 344px) {
            body, .sign-form {
                font-size: 0.6rem;
                width: 100%;
            }
        }
        @media (min-width: 1024px) {
            body, .sign-form {
                font-size: 0.8rem;
                width: 100%;
            }
        }
        @media (min-width: 1440px) {
            body, .sign-form {
                font-size: 1rem;
                width: 100%;
            }
        }
        .form-header {
            text-align: center;
            margin-bottom: 10px;
        }
        .form-header h2 {
            font-size: 1.8rem;
            color: #333;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: bold;
            color: #555;
        }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group input[type="date"] {
            width: 100%;
            height: 35px;
            padding: 10px;
            font-weight: bold;
            border: 1px solid #4f46e5;
            border-radius: 5px;
            background: #f9f9f9;
        }
        .gender-group {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
            margin-left: -10px;
            font-weight: bold;
        }
        .gender-group label {
            display: inline-flex;
            align-items: center;
            font-weight: large;
            cursor: pointer;
        }
        .gender-group input[type="radio"] {
            margin-right: 5px;
        }
        .submit {
            text-align: center;
            margin-top: 5px;
        }
        .submit button {
            width: 50%;
            height: auto;
            padding: 5px;
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .submit button:hover {
            background: #fff;
            color: #4f46e5;
            border: 2px solid #4f46e5;
        }
        .alternative-options {
            text-align: center;
            margin-top: 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #666;
        }
        .alternative-options a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        .alternative-options a:hover {
            text-decoration: underline;
        }
        .flash-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .flash-message.success {
            background-color: #28a745;
        }

        .flash-message.error {
            background-color: #dc3545;
        }

        .flash-message.visible {
            opacity: 1;
        }
        @media (max-width: 768px) {
            .sign-form {
                max-width: 300px;
                font-size: 0.03rem;
            }
            .form-header h2 {
                font-size: 1.8rem;
            }
        }
        @media (min-width: 1200px) {
            .sign-form {
                max-width: 500px;
            }
        }
           @media (min-width: 912px) {
            .sign-form {
                max-width: 500px;
            }
        }
           @media (min-width: 375px) {
            .sign-form {
                max-width: 500px;
                font-size: 0.01rem;
            }
        }
           @media (min-width: 430px) {
            .sign-form {
                max-width: 500px;
                font-size: 0.05rem;
            }
        }
        @media (min-width: 986px) {
            .sign-form {
                max-width: 400px;
                font-size: 0.02rem;
            }
        }
        @media (min-width: 360px) {
            .sign-form {
                max-width: 200px;
                font-size: 0.001rem;
            }
        }
        @media (min-width: 320px) {
            .sign-form {
                max-width: 400px;
                font-size: 0.0002rem;
            }
        }
        @media (min-width: 384px) {
            .sign-form {
                max-width: 400px;
                font-size: 0.02rem;
            }
        }
        @media (min-width: 640px) {
            .sign-form {
                height: 500px;
                max-width: 900px;
                font-size: 2rem;
            }
            .form-group label {
                font-size: 1rem;
            }
            .form-group input[type='text'], 
            .form-group input[type='email'],
            .form-group input[type='password'],
            .form-group input[type='date'] {
                height: 33px;
                font-size: 0.7rem;
            }
            .form-group input[type='gender'] {
                height: 12px;
            }
            .form-header h2 {
                font-size: 1.5rem;
            }
            .submit button {
                width: 100px;
                height: 30px;
                font-size: 0.7rem;
            }
            .alternative-options {
                font-size: 0.8rem;
            }
        }
        @media (min-width: 540px) {
            .sign-form {
                max-width: 400px;
                font-size: 0.01rem;
            }
        }
        @media (min-width: 344px) {
            .sign-form {
                max-width: 400px;
                font-size: 0.004rem;
            }
        }
        @media (min-width: 412px) {
            .sign-form {
                max-width: 300px;
                font-size: 0.002rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="sign-form">
            <form id="signup-form" action="/sign" method="POST" enctype="multipart/form-data">
                <div class="form-header">
                    <h2>Sign Up</h2>
                </div>
                <div class="form-group"><br>
                    <label for="fname">First Name:</label>
                    <input type="text" id="fname" name="fname" placeholder="First name" required>
                </div>
                <div class="form-group"><br>
                    <label for="lname">Last Name:</label>
                    <input type="text" id="lname" name="lname" placeholder="Last name" required>
                </div>
                <div class="form-group"><br>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Your email" required>
                </div>
                <div class="form-group gender-group"><br>
                    <label>Gender:</label>
                    <label><input type="radio" name="gender" value="male" required> Male</label>
                    <label><input type="radio" name="gender" value="female" required> Female</label>
                </div>
                <div class="form-group"><br>
                    <label for="date">Date of Birth:</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div class="form-group"><br>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Your password" required minlength="8">
                </div>
                <div class="form-group"><br>
                    <label for="confirm-password">Confirm Password:</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm password" required minlength="8">
                </div><br>
                <div class="submit">
                    <button type="submit">Sign Up</button>
                </div>
            </form>
            <div class="alternative-options">
                Already have an account? <a href="/log">Login</a>
            </div>
        </section>
    </div>

    <!-- Flash message container -->
    <div id="flash-message" class="flash-message"></div>

    <script>
        // JavaScript for form validation and flash messages
        document.getElementById('signup-form').addEventListener('submit', function(event) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const flash = document.getElementById('flash-message');

            if (password !== confirmPassword) {
                event.preventDefault();
                showFlash('Passwords do not match!', 'error');
                return;
            }

            // Simulate successful submission (since backend handles actual submit)
            // In real scenario, you might use AJAX to submit and get response
            showFlash('Signing up... Please wait.', 'success');

            // For demo: After submit, you can redirect or handle as needed
            // event.preventDefault(); // Uncomment if using AJAX
        });

        function showFlash(message, type) {
            const flash = document.getElementById('flash-message');
            flash.textContent = message;
            flash.classList.remove('success', 'error');
            flash.classList.add(type, 'visible');
            setTimeout(() => {
                flash.classList.remove('visible');
            }, 3000);
        }
    </script>
</body>
</html>
